name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # <user>.github.io リポジトリなら空、プロジェクトページなら /<repo>
      - name: Compute base path
        id: bp
        run: |
          repo="${{ github.event.repository.name }}"
          case "$repo" in
            *.github.io) echo "base=" >> "$GITHUB_OUTPUT" ;;
            *) echo "base=/$repo" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.bp.outputs.base }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
